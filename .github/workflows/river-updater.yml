name: Telemetry Health Monitor & Redundancy Guard

on:
  schedule:
    # Auditoria de integridade a cada 30 minutos (motor principal é o Supabase Cron)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite acionamento e auditoria manual no painel de Actions do GitHub

jobs:
  monitor-telemetry:
    name: Auditar e Validar Supabase Cron
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: river-updater/package.json

      - name: Instalar Dependências (river-updater)
        run: |
          cd river-updater
          npm ci || npm install

      - name: Executar Auditoria de Integridade Hidrológica
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OFFICIAL_SOURCE_URL: ${{ secrets.OFFICIAL_SOURCE_URL }}
        run: |
          cd river-updater
          npm run monitor

